<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IStructE - Golden Data Specification</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1b7352" />
  <link rel="stylesheet" href="css/spec.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="nav-sticky">
    <header class="site-header">
      <div class="site-header-top">
        <div class="site-brand">
          <p class="site-eyebrow">IStructE</p>
          <p class="site-title">Golden Data Specification</p>
        </div>
        <div class="site-header-actions">
          <div class="find-tool" role="search">
            <label class="visually-hidden" for="find-input">Find in document</label>
            <input
              type="search"
              id="find-input"
              class="find-input"
              placeholder="Find…"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <span id="find-count" class="find-count" aria-live="polite">—</span>
            <button type="button" id="find-prev" class="find-nav-btn" aria-label="Previous match" disabled>
              ↑
            </button>
            <button type="button" id="find-next" class="find-nav-btn" aria-label="Next match" disabled>
              ↓
            </button>
          </div>
          <button type="button" id="btn-print" class="btn-print">
            Print
          </button>
          <button type="button" id="btn-install" class="btn-install">
            Download
          </button>
        </div>
      </div>
      <nav id="nav-primary" class="nav-primary" aria-label="Main sections"></nav>
    </header>
    <div id="nav-subnav" class="nav-subnav">
      <nav id="nav-secondary" class="nav-secondary" aria-label="Subsections" hidden></nav>
      <div class="nav-deep">
        <nav id="nav-tertiary" class="nav-tertiary" aria-label="Subsections" hidden></nav>
        <nav id="nav-quaternary" class="nav-quaternary" aria-label="Design and construction stages" hidden></nav>
      </div>
    </div>
  </div>

  <div class="page-shell">
    <header class="page-header">
      <p class="page-position" id="page-position" aria-live="polite"></p>
      <p class="page-eyebrow" id="page-eyebrow"></p>
      <h1 class="page-title" id="page-title"></h1>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="page-turner" aria-label="Move between sections">
      <button type="button" class="page-btn" id="btn-prev" disabled>
        ← Previous
      </button>
      <button type="button" class="page-btn" id="btn-next">
        Next →
      </button>
    </nav>

  </div>

  <div id="print-dialog" class="print-dialog" hidden>
    <div class="print-dialog-panel" role="dialog" aria-labelledby="print-dialog-title" aria-modal="true">
      <h2 id="print-dialog-title" class="print-dialog-title">Print</h2>
      <p class="print-dialog-text">Choose what to print.</p>
      <div class="print-dialog-actions">
        <button type="button" id="btn-print-page" class="print-dialog-btn">Print Page</button>
        <button type="button" id="btn-print-document" class="print-dialog-btn print-dialog-btn-primary">Print Document</button>
      </div>
      <button type="button" id="btn-print-cancel" class="print-dialog-cancel">Cancel</button>
    </div>
  </div>

  <script src="js/spec-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/find.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
